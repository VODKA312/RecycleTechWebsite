name: Deploy to Production

on:
  push:
    branches:
      - dev
    tags:
      - 'release-*'
    paths-ignore:
      - 'README.md'
      - 'DEPLOYMENT.md'
      - '**.md'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check commit message for deployment trigger
      id: check-commit
      run: |
        if [[ "${{ github.event.head_commit.message }}" == *"#release"* ]]; then
          echo "RELEASE_TRIGGER=true" >> $GITHUB_OUTPUT
          echo "Deployment triggered by #release in commit message"
        elif [[ "${{ github.event.head_commit.message }}" == *"#deploy"* ]]; then
          echo "DEPLOY_TRIGGER=true" >> $GITHUB_OUTPUT
          echo "Deployment triggered by #deploy in commit message"
        else
          echo "RELEASE_TRIGGER=false" >> $GITHUB_OUTPUT
          echo "DEPLOY_TRIGGER=false" >> $GITHUB_OUTPUT
          echo "No deployment trigger found in commit message"
        fi
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-ci.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
        
    - name: Verify dependencies
      run: |
        python -c "import django; print(f'Django version: {django.get_version()}')"
        python -c "import asgiref; print(f'ASGI version: {asgiref.__version__}')"
        
    - name: Run tests
      run: |
        python manage.py test
        
    - name: Collect static files
      run: |
        python manage.py collectstatic --noinput
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      run: |
        docker build -t recycletech:${{ github.sha }} .
        docker tag recycletech:${{ github.sha }} recycletech:latest
        
    - name: Deploy to production server
      if: steps.check-commit.outputs.RELEASE_TRIGGER == 'true'
      run: |
        echo "Deploying release to production server..."
        echo "Triggered by #release in commit message: ${{ github.event.head_commit.message }}"
        # 使用Docker部署到生产服务器
        echo "Building and deploying Docker containers to production..."
        
        # 保存Docker镜像
        docker save recycletech:latest | gzip > recycletech.tar.gz
        
        # 上传到服务器并部署
        echo "Uploading Docker image to production server..."
        
    - name: Deploy to staging server
      if: steps.check-commit.outputs.DEPLOY_TRIGGER == 'true' && github.ref == 'refs/heads/dev'
      run: |
        echo "Deploying to staging environment..."
        echo "Triggered by #deploy in commit message: ${{ github.event.head_commit.message }}"
        # 使用Docker部署到测试环境
        echo "Building and deploying Docker containers to staging..."
        
        # 保存Docker镜像
        docker save recycletech:latest | gzip > recycletech-staging.tar.gz
        
        # 上传到测试服务器并部署
        echo "Uploading Docker image to staging server."
        
    - name: Deploy to production via SSH
      if: steps.check-commit.outputs.RELEASE_TRIGGER == 'true'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ALIYUN_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: 22
        script_stop: true
        timeout: 60s
        script: |
          echo "Deploying RecycleTech to production server..."
          cd /var/www/recycletech
          
          # 停止现有容器
          docker-compose down || true
          
          # 拉取最新代码
          git pull origin main
          
          # 重新构建并启动容器
          docker-compose build --no-cache
          docker-compose up -d
          
          # 检查服务状态
          docker-compose ps
          echo "Production deployment completed!"
          
    - name: Deploy to staging via SSH
      if: steps.check-commit.outputs.DEPLOY_TRIGGER == 'true' && github.ref == 'refs/heads/dev'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ALIYUN_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: 22
        script: |
          echo "Deploying RecycleTech to staging server..."
          cd /var/www/recycletech-staging
          
          # 停止现有容器
          docker-compose down || true
          
          # 拉取最新代码
          git pull origin dev
          
          # 重新构建并启动容器
          docker-compose build --no-cache
          docker-compose up -d
          
          # 检查服务状态
          docker-compose ps
          echo "Staging deployment completed!"
          
    - name: Skip deployment
      if: steps.check-commit.outputs.RELEASE_TRIGGER == 'false' && steps.check-commit.outputs.DEPLOY_TRIGGER == 'false'
      run: |
        echo "No deployment trigger found in commit message: ${{ github.event.head_commit.message }}"
        echo "To trigger deployment, include one of these keywords in your commit message:"
        echo "  - #release  : Deploy to production"
        echo "  - #deploy   : Deploy to staging (dev branch only)"
        echo "Skipping deployment..." 